id: roundcube-webmail-twofactor

info:
  name: Roundcube twofactor_gauthenticator
  author: kay
  severity: info
  description: |
    Detects the presence of Roundcube webmail client  from the HTTP response.
  reference: 
    - https://github.com/alexandregz/twofactor_gauthenticator
  tags: tech, webmail, roundcube, mail, 

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/mail/"

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "twofactor_gauthenticator"
