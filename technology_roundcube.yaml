id: roundcube-detection
info:
  name: Roundcube
  author: kay
  severity: info
  description: |
    Detect the Roundcube
  tags: tech
  reference:
    - https://roundcube.net/

requests:
  - method: GET
    path:
      - "{{BaseURL}}/mail/index.php"
      - "{{BaseURL}}/index.php"

    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"

    matchers:
      - type: word
        words:
          - "Roundcube"
        part: body
        condition: or

    extractors:
      - type: regex
        part: body
        regex:
          - "(Roundcube)"
        group: 1
